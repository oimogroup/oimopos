<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Доступ к аккаунту · Oimo</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/account.css"><script defer src="/api-client.js"></script><script defer src="/account.js"></script><link rel="stylesheet" href="/ui-theme.css?v=1">
</head>
<body data-ui="account"><main><a class="brand" href="/">Oimo</a><section><h1 id="accountTitle">Восстановить пароль</h1><p id="accountDescription">Укажите email, который использовали при регистрации.</p><p id="accountMessage" role="status" aria-live="polite"></p>
<form id="forgotForm"><label>Email<input name="email" type="email" autocomplete="email" maxlength="200" required></label><button type="submit">Отправить ссылку</button></form>
<form id="resetForm" hidden><label>Новый пароль<input name="password" type="password" autocomplete="new-password" minlength="5" maxlength="200" required></label><label>Повторите пароль<input name="confirmation" type="password" autocomplete="new-password" minlength="5" maxlength="200" required></label><p class="note">Не менее 5 символов. После смены пароля прежние сеансы завершатся.</p><button type="submit">Сохранить пароль</button></form>
<form id="verifyForm" hidden><button type="submit">Подтвердить email</button></form>
<form id="resendForm" hidden><p id="verificationAddress"></p><button type="submit">Отправить письмо подтверждения</button></form>
<p class="links"><a href="/login?mode=admin">Вернуться ко входу</a><a id="requestNewLink" href="/account" hidden>Запросить новую ссылку</a><a id="workspaceLink" href="/admin" hidden>В аккаунт</a></p></section></main></body></html>
