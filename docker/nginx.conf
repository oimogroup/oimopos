server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / { add_header Cache-Control "no-cache" always; try_files /landing.html =404; }
    location = /landing.html { return 301 /; }
    location = /index.html { return 301 /pos$is_args$args; }
    location = /pos { add_header Cache-Control "no-store" always; try_files /index.html =404; }
    location = /admin.html { return 301 /admin$is_args$args; }
    location = /admin { add_header Cache-Control "no-store" always; try_files /admin.html =404; }
    location = /login.html { return 301 /login$is_args$args; }
    location = /login { add_header Cache-Control "no-store" always; try_files /login.html =404; }
    location = /platform.html { return 301 /platform$is_args$args; }
    location = /platform { add_header Cache-Control "no-store" always; try_files /platform.html =404; }

    location = /billing.html { return 301 /billing$is_args$args; }
    location = /billing { add_header Cache-Control "no-store" always; try_files /billing.html =404; }
    location /legal/ { proxy_pass http://api:8000; proxy_set_header Host $host; }

    location /api/ {
        client_max_body_size 8m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
