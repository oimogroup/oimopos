services:
  - type: web
    name: oimo
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./render.Dockerfile
    dockerContext: .
    preDeployCommand: python /app/render_migrate.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oimo-db
          property: connectionString
      - key: PLATFORM_INITIAL_LOGIN
        value: platform
      - key: PLATFORM_INITIAL_PASSWORD
        sync: false
      - key: EMPLOYEE_PIN_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: ""
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        value: oimogroup2027@gmail.com
      - key: SMTP_FROM_NAME
        value: Oimo
      - key: FREEDOMPAY_ENABLED
        value: "false"
      - key: FREEDOMPAY_TEST_MODE
        value: "true"
      - key: FREEDOMPAY_API_BASE
        value: https://api.freedompay.kg
      - key: FREEDOMPAY_INIT_PATH
        value: /init_payment
      - key: SELLER_SUPPORT_EMAIL
        value: support@oimopos.com
databases:
  - name: oimo-db
    databaseName: oimo
    user: oimo
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
