<!doctype html><meta charset="utf-8"><pre id="results">RUNNING</pre><iframe id="app" src="../admin.html?test=1#menu/products" style="width:1400px;height:1000px"></iframe><script>
if(new URLSearchParams(location.search).has("preview")) app.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:white";
app.onload=async()=>{const w=app.contentWindow,d=w.document,c=[],groupName='Тест сок '+Date.now();const check=(n,v)=>c.push(`${v?'PASS':'FAIL'}:${n}`);try {
w.openProductForm();d.querySelector('#productNameInput').value=groupName;const station=d.querySelector('#productStationInput');station.selectedIndex=1;const stationName=station.value;
const mode=d.querySelector('#productVariantsEnabled');mode.checked=true;mode.dispatchEvent(new w.Event('change'));
check('mode-hides-single-price',d.querySelector('#productSinglePriceSection').classList.contains('hidden'));
d.querySelector('[data-variant-name]').value='Яблоко';d.querySelector('[data-variant-price]').value=100;d.querySelector('#addProductVariant').click();const rows=d.querySelectorAll('.product-variant-row');rows[1].querySelector('[data-variant-name]').value='Апельсин';rows[1].querySelector('[data-variant-price]').value=120;
const color=rows[1].querySelector('[data-variant-color]');color.value='#aabbcc';color.dispatchEvent(new w.Event('input',{bubbles:true}));
await w.saveProductForm();const variants=w.eval(`products.filter(p=>p.groupName===${JSON.stringify(groupName)})`);check('variant-own-color',variants[1].color==='#aabbcc');check('two-skus',variants.length===2&&variants[0].id!==variants[1].id);check('station-saved',variants.every(p=>p.station===stationName));check('group-one-row',d.querySelectorAll(`[data-product-edit="${variants[1].id}"]`).length===0);
w.openProductForm(variants[0].id);check('edit-restores',d.querySelectorAll('.product-variant-row').length===2&&mode.checked&&station.value===stationName);
const photoCanvas=d.createElement('canvas');photoCanvas.width=8;photoCanvas.height=8;photoCanvas.getContext('2d').fillRect(0,0,8,8);const photoBlob=await (await fetch(photoCanvas.toDataURL('image/png'))).blob(),photoInput=d.querySelector('[data-variant-photo="1"]'),transfer=new w.DataTransfer();transfer.items.add(new w.File([photoBlob],'variant.png',{type:'image/png'}));photoInput.files=transfer.files;photoInput.dispatchEvent(new w.Event('change',{bubbles:true}));check('variant-photo-shows-progress',photoInput.disabled&&d.querySelector('[data-variant-photo-status]').getAttribute('aria-busy')==='true');for(let i=0;i<100&&photoInput.isConnected;i++)await new Promise(resolve=>setTimeout(resolve,20));await w.saveProductForm();check('variant-photo-is-compressed-and-saved',w.productById(variants[1].id).image.startsWith('data:image/'));
w.openProductForm(variants[0].id);d.querySelector('[data-variant-price]').value=115;await w.saveProductForm();check('edit-preserves-id',w.productById(variants[0].id).price===115);
if(new URLSearchParams(location.search).has('preview')) w.openProductForm(variants[0].id);
}catch(e){c.push('FAIL:'+e.stack)}results.textContent=c.join('|')};</script>
