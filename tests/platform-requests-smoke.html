<!doctype html><html lang="ru"><meta charset="utf-8"><title>Platform request inbox checks</title><pre id="results">RUNNING</pre><iframe id="app" title="Тест кабинета платформы" style="width:1200px;height:900px;border:0"></iframe><script>
(async()=>{
 const checks=[],check=(name,ok)=>checks.push(`${ok?'PASS':'FAIL'}:${name}`),pause=()=>new Promise(r=>setTimeout(r,30));
 try{
  const source=await fetch('/platform').then(r=>r.text());
  const stub=`<script>window.__rows=[{id:'11111111-1111-4111-8111-111111111111',company:'Кафе <тест>',name:'Анна',phone:'996000000000',plan:'restaurant',status:'new',created_at:'2026-10-21T10:00:00Z'}];window.AshkanaApi={me:async()=>({session:{role:'platform_owner',name:'Тест платформы',initials:'ТП'}}),tenants:async()=>[],plans:async()=>[{code:'canteen',name:'Столовая',monthly_price:2000},{code:'restaurant',name:'Ресторан',monthly_price:3500}],connectionRequests:async()=>window.__rows,markRequestContacted:async(id)=>{window.__rows[0].status='contacted';return {ok:true};}};window.fetch=()=>Promise.reject(new Error('Unexpected live API request'));<\/script>`;
  const platformCode=await fetch('/platform.js').then(r=>r.text());
  const fixtureSource=source.replace(/<script src="platform\.js[^"]*"><\/script>/,stub+'<script>'+platformCode.replaceAll('location.origin','new URL(document.baseURI).origin')+'<\/script>');
  const frame=document.querySelector('#app');
  await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.srcdoc=fixtureSource.replace('<head>','<head><base href="/">');});
  const d=frame.contentDocument,q=s=>d.querySelector(s);
  for(let i=0;i<30&&!q('[data-create-from-request]');i++)await pause();
  if(!q('[data-create-from-request]'))throw new Error(q('#connectionRequestsList').textContent+' / '+q('#toast').textContent+' / origin='+frame.contentWindow.location.origin);
  check('request-displayed',q('#connectionRequestsList').textContent.includes('Кафе <тест>'));
  check('contact-escaped',!q('#connectionRequestsList тест'));
  check('phone-action',q('#connectionRequestsList a').getAttribute('href')==='tel:+996000000000');
  check('new-request-count',q('#connectionRequestCount').textContent==='1');
  q('[data-create-from-request]').click();
  check('create-prefills-company',q('#tenantName').value==='Кафе <тест>'&&q('#tenantLocationName').value==='Кафе <тест>');
  check('create-prefills-contact-and-plan',q('#tenantOwnerName').value==='Анна'&&q('#tenantPhone').value==='+996000000000'&&q('#tenantPlan').value==='restaurant');
  q('[data-contact-request]').click();for(let i=0;i<30&&q('[data-contact-request]');i++)await pause();
  check('contacted-status-persists',q('#connectionRequestsList').textContent.includes('Связались')&&!q('[data-contact-request]'));
  check('counter-clears',q('#connectionRequestCount').textContent==='');
 }catch(error){check('runtime:'+error.stack,false);}
 document.querySelector('#results').textContent=checks.join('|');
})();
</script></html>
