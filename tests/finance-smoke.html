<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8"><title>Finance smoke test</title></head>
  <body>
    <div id="results">RUNNING</div>
    <iframe id="app" src="../admin?test=1#finance/pnl" style="position:fixed;left:-10000px;width:1440px;height:1000px"></iframe>
    <script src="finance-period-unit.js"></script>
    <script>
      document.querySelector("#app").addEventListener("load", async () => {
        const frame = document.querySelector("#app");
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        const financeKey = "ashkana-finance-v1";
        const salesKey = "ashkana-pos-sales";
        const snapshot = { finance: win.localStorage.getItem(financeKey), sales: win.localStorage.getItem(salesKey) };
        const checks = [];
        const check = (name, condition) => checks.push(`${condition ? "PASS" : "FAIL"}:${name}`);
        try {
          win.localStorage.setItem(salesKey, JSON.stringify([{
            id: "finance-sale-1", number: 7, branchId: "b1", branch: "Столовая №1 — Манаса",
            createdAt: new Date().toISOString(), paymentMethod: "card", total: 1000, cashier: "Тест",
            items: [{ id: "p-1", name: "Вода", category: "Напитки", price: 100, unitCost: 40, quantity: 10 }]
          }]));
          win.renderAll();
          win.switchView("finance");
          check("real-sales-revenue", /1\s*000/.test(doc.querySelector("#financeRevenue").textContent));
          check("calculated-profit", doc.querySelector("#financeNetProfit").textContent.includes("600"));
          check("six-working-tabs-including-payroll", doc.querySelectorAll("[data-finance-tab]").length === 6 && !!doc.querySelector('[data-finance-tab="payroll"]'));

          win.openFinanceTransactionForm();
          doc.querySelector("#financeTransactionType").value = "expense";
          doc.querySelector("#financeTransactionType").dispatchEvent(new Event("change", { bubbles: true }));
          doc.querySelector("#financeTransactionAccount").value = "finance-bank";
          doc.querySelector("#financeTransactionCategory").value = "finance-expense-rent";
          doc.querySelector("#financeTransactionBranch").value = "b1";
          doc.querySelector("#financeTransactionAmount").value = "150";
          doc.querySelector("#financeTransactionCounterparty").value = "Арендодатель";
          await win.saveFinanceTransaction();
          let savedFinance = JSON.parse(win.localStorage.getItem(financeKey));
          check("expense-saved", savedFinance.transactions.length === 1 && savedFinance.transactions[0].amount === 150);
          check("expense-in-register", doc.querySelector("#financeTransactionsTable").textContent.includes("Арендодатель") && doc.querySelector("#financeTransactionsTable").textContent.includes("Аренда и коммунальные"));
          check("profit-updated", doc.querySelector("#financeNetProfit").textContent.includes("450"));

          win.openFinanceTransactionForm();
          doc.querySelector("#financeTransactionType").value = "transfer";
          doc.querySelector("#financeTransactionType").dispatchEvent(new Event("change", { bubbles: true }));
          doc.querySelector("#financeTransactionAccount").value = "finance-bank";
          doc.querySelector("#financeTransactionDestination").value = "finance-safe";
          doc.querySelector("#financeTransactionAmount").value = "200";
          await win.saveFinanceTransaction();
          savedFinance = JSON.parse(win.localStorage.getItem(financeKey));
          check("transfer-saved", savedFinance.transactions.some((entry) => entry.type === "transfer"));
          check("transfer-not-in-profit", doc.querySelector("#financeNetProfit").textContent.includes("450"));
          check("account-balances", win.financeAccountBalance("finance-bank") === 650 && win.financeAccountBalance("finance-safe") === 200);

          win.openFinanceAccountForm();
          doc.querySelector("#financeAccountName").value = "Тестовый счёт";
          doc.querySelector("#financeAccountType").value = "other";
          doc.querySelector("#financeAccountOpening").value = "500";
          await win.saveFinanceAccount();
          check("account-create", doc.querySelector("#financeAccountsTable").textContent.includes("Тестовый счёт"));

          win.openFinanceCategoryForm("expense");
          doc.querySelector("#financeCategoryName").value = "Тестовая статья";
          await win.saveFinanceCategory();
          check("category-create", doc.querySelector("#financeExpenseCategories").textContent.includes("Тестовая статья"));

          win.switchFinanceTab("shifts");
          check("shift-register", doc.querySelector("#financeShiftsTable").textContent.includes("кассовых смен нет"));
          win.switchFinanceTab("pnl");
          check("pnl-lines", doc.querySelector("#financePnlRows").textContent.includes("Себестоимость") && doc.querySelector("#financePnlRows").textContent.includes("Аренда и коммунальные"));

          for (const name of runFinancePeriodTests(await (await fetch('../admin.js')).text())) check(name, true);
          win.eval('companyGeneralSettings.timezone = "UTC"; companyGeneralSettings.shiftEnd = "00:00"; financeState.transactions = [];');
          win.localStorage.setItem(salesKey, JSON.stringify([{
            id: 'audit-return', number: 42, branchId: 'b1', cashier: 'Тест',
            createdAt: '2026-10-05T12:00:00Z', refundedAt: '2026-10-06T12:00:00Z',
            paymentMethod: 'card', payments: [{method:'card',amount:100}], total:100,
            items: [{id:'p-1',name:'Вода',price:100,quantity:1,unitCost:40}]
          }]));
          for (const prefix of ['finance', 'report']) {
            doc.querySelector(`#${prefix}DateFrom`).value = '2026-10-06';
            doc.querySelector(`#${prefix}DateTo`).value = '2026-10-06';
            doc.querySelector(`#${prefix}BranchFilter`).value = 'all';
          }
          win.renderFinance();
          win.renderAnalyticsSales();
          check('refund-visible-in-finance-and-analytics', /-100/.test(doc.querySelector('#financeRevenue').textContent.replace(/\s/g,'')) && /-100/.test(doc.querySelector('#reportRevenue').textContent.replace(/\s/g,'')));
          check('refund-visible-in-transaction-register', doc.querySelector('#financeTransactionsTable').textContent.includes('Возврат чека №42'));
          check('refund-only-period-has-no-fake-receipts', doc.querySelector('#reportReceiptCount').textContent === '0');
          check('refund-chart-has-valid-coordinates', !doc.querySelector('#reportSalesChart').innerHTML.includes('NaN'));
        } catch (error) {
          checks.push(`FAIL:runtime:${error.message}`);
        } finally {
          snapshot.finance === null ? win.localStorage.removeItem(financeKey) : win.localStorage.setItem(financeKey, snapshot.finance);
          snapshot.sales === null ? win.localStorage.removeItem(salesKey) : win.localStorage.setItem(salesKey, snapshot.sales);
        }
        document.querySelector("#results").textContent = checks.join("|");
      });
    </script>
  </body>
</html>
