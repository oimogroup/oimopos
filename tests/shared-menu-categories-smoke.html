<!doctype html><meta charset="utf-8"><pre id="results">RUNNING</pre>
<iframe id="app" src="../admin.html?test=1#menu/menu-categories"></iframe>
<script>
app.onload = async () => {
  const w = app.contentWindow, d = w.document, checks = [];
  const check = (name, value) => { checks.push(`${value ? 'PASS' : 'FAIL'}:${name}`); };
  const rows = () => [...d.querySelectorAll('#menuCategoriesTable tr')];
  const categoryRow = name => rows().find(row => row.querySelector('strong')?.textContent === name);
  try {
    w.eval(`menuCategories = [{name:'Общие напитки',color:'#123456'}];
      recipeCategories = [{name:'общие напитки',color:'#abcdef'},{name:'Только старая техкарта',color:'#654321'}];
      productCategories = [{name:'Старая пустая',color:'#112233'}];
      recipes.find(row=>row.id===201).category='Общие напитки';
      products.find(row=>row.id==='p-1').category='Общие напитки';`);
    w.renderAll(); w.switchMenuPage('recipe-categories');
    check('one-shared-navigation', d.querySelectorAll('[data-menu-page="menu-categories"]').length === 1 && !d.querySelector('[data-menu-page="recipe-categories"]'));
    check('legacy-route-opens-shared-screen', d.querySelector('#menu-pane-menu-categories').classList.contains('active'));
    check('same-name-is-not-duplicated', rows().filter(row => row.querySelector('strong')?.textContent.toLowerCase() === 'общие напитки').length === 1);
    check('empty-legacy-group-preserved', !!categoryRow('Старая пустая'));
    check('counts-both-types', Number(categoryRow('Общие напитки').cells[1].textContent) > 0 && Number(categoryRow('Общие напитки').cells[2].textContent) > 0);
    categoryRow('Общие напитки').querySelector('[data-menu-category-edit]').click();
    d.querySelector('#categoryNameInput').value = 'Бар общий';
    d.querySelector('#categoryColorText').value = '#224466';
    await w.saveCategoryForm();
    check('rename-updates-both-types', w.eval(`recipes.find(row=>row.id===201).category==='Бар общий' && products.find(row=>row.id==='p-1').category==='Бар общий'`));
    check('rename-saved-in-both-legacy-views', ['ashkana-recipe-categories-v1','ashkana-product-categories-v1'].every(key => JSON.parse(w.localStorage.getItem(key)).some(row => row.name === 'Бар общий' && row.color === '#224466')));
    w.openCategoryForm('menu'); d.querySelector('#categoryNameInput').value = 'Новая общая';
    await w.saveCategoryForm();
    w.openRecipeForm(201);
    check('new-group-available-in-recipe', [...d.querySelector('#recipeCategoryInput').options].some(row => row.value === 'Новая общая'));
    d.querySelector('#recipeModal').classList.add('hidden'); w.openProductForm('p-1');
    check('new-group-available-in-product', [...d.querySelector('#productCategoryInput').options].some(row => row.value === 'Новая общая'));
    d.querySelector('#productModal').classList.add('hidden');
    w.requestCatalogDelete('menu-category', 'Бар общий', 'Бар общий');
    check('populated-group-delete-blocked', d.querySelector('#confirmCatalogDeleteButton').disabled);
    d.querySelector('#catalogDeleteModal').classList.add('hidden');
    categoryRow('Новая общая').querySelector('[data-menu-category-edit]').click();
    d.querySelector('#deleteCategoryButton').click();
    check('empty-group-delete-offered', !d.querySelector('#confirmCatalogDeleteButton').disabled);
    await w.confirmCatalogDelete();
    check('empty-group-removed-from-both-views', w.eval(`!recipeCategories.some(row=>row.name==='Новая общая') && !productCategories.some(row=>row.name==='Новая общая')`));
  } catch (error) { checks.push('FAIL:runtime:' + error.stack); }
  results.textContent = checks.join('|');
};
</script>
