<!doctype html><html lang="ru"><meta charset="utf-8"><title>Oimo landing checks</title><pre id="results" style="white-space:pre-wrap">RUNNING</pre><iframe id="app" style="width:100%;height:950px;border:0" title="Лендинг Oimo"></iframe><script>
(async()=>{
 const checks=[],check=(name,ok)=>{checks.push(`${ok?'PASS':'FAIL'}:${name}`);document.querySelector('#results').textContent=checks.join('|');};
 const pause=()=>new Promise(r=>setTimeout(r,30));
 try{
  const frame=document.querySelector('#app');
  const width=Number(new URLSearchParams(location.search).get('width'));
  if(width>=320&&width<=1440)frame.style.width=width+'px';
  const response=await fetch('/');const source=await response.text();
  check('root-is-public-landing',response.ok&&source.includes('id="connectionForm"')&&source.includes('<title>Oimo — касса'));
  const stub=`<script>window.__posts=[];window.__outcome='offline';window.fetch=async(url,options={})=>{if(url==='/api/v1/public/plans')return new Response(JSON.stringify([{code:'canteen',monthly_price:3500,annual_price:42000},{code:'restaurant',monthly_price:4000,annual_price:48000}]),{headers:{'Content-Type':'application/json'}});if(url==='/api/v1/public/register'){window.__posts.push(JSON.parse(options.body));if(window.__outcome==='offline')throw new TypeError('Failed to fetch');return new Response(JSON.stringify({session:{role:'owner',subscriptionStatus:'trialing'},redirect:'/admin'}),{status:201,headers:{'Content-Type':'application/json'}});}throw new Error('Unexpected request '+url);};<\/script>`;
  await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.srcdoc=source.replace('<head>','<head><base href="/">'+stub);});
  const w=frame.contentWindow,d=frame.contentDocument,q=s=>d.querySelector(s);
  await pause();
  check('pricing-from-server',q('[data-price="canteen"]').textContent.replace(/\s/g,'')==='3500'&&q('[data-price="restaurant"]').textContent.replace(/\s/g,'')==='4000');
  q('#pricingPeriod').value='annual';q('#pricingPeriod').dispatchEvent(new w.Event('change'));
  check('annual-total-from-server',q('[data-price="canteen"]').textContent.replace(/\s/g,'')==='42000'&&q('[data-price="restaurant"]').textContent.replace(/\s/g,'')==='48000'&&q('[data-price-unit="canteen"]').textContent==='сом / год');
  q('#pricingPeriod').value='monthly';q('#pricingPeriod').dispatchEvent(new w.Event('change'));
  check('monthly-price-restored',q('[data-price="canteen"]').textContent.replace(/\s/g,'')==='3500');
  check('initial-preview',!q('#preview-pos').hidden&&q('#preview-stock').hidden);
  q('#tab-stock').click();check('switch-preview',!q('#preview-stock').hidden&&q('#preview-pos').hidden&&q('#tab-stock').getAttribute('aria-selected')==='true');
  q('#tab-stock').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));check('keyboard-preview',!q('#preview-finance').hidden&&d.activeElement===q('#tab-finance'));
  q('[data-plan-choice="restaurant"]').addEventListener('click',e=>e.preventDefault(),{once:true});q('[data-plan-choice="restaurant"]').click();check('pricing-selects-format',q('select[name=plan]').value==='restaurant');
  const form=q('#connectionForm');form.elements.name.value='Тестовый посетитель';form.elements.company.value='Тестовое заведение';form.elements.phone.value='+996 555 123 456';form.elements.consent.checked=true;form.elements.email.value='trial@example.com';form.elements.password.value='test-password-123';form.elements.passwordConfirm.value='test-password-123';
  form.requestSubmit();for(let i=0;i<30&&!q('#formMessage').textContent;i++)await pause();
  check('failed-submit-stays-retryable',!q('#connectionSubmit').disabled&&!form.hidden&&q('#formMessage').textContent.includes('связи'));
  const id=w.__posts[0]?.request_id;w.__outcome='ok';form.requestSubmit();for(let i=0;i<30&&!form.hidden;i++)await pause();
  check('retry-keeps-request-id',w.__posts.length===2&&w.__posts[1].request_id===id&&!!id);
  check('confirmed-success',form.hidden&&!q('#formSuccess').hidden);
  check('contact-not-in-storage',!w.sessionStorage.getItem('oimo-registration-pending'));
  check('privacy-and-no-payment-promise',!!q('#data-policy')&&source.includes('Автоматических списаний нет'));
  check('all-anchor-targets-exist',[...d.querySelectorAll('a[href^="#"]')].every(a=>!!d.getElementById(a.getAttribute('href').slice(1))));
  check('no-horizontal-overflow',d.documentElement.scrollWidth<=w.innerWidth+1);
  check('login-link-available',!!q('a[href="/login"]'));
  check('no-live-business-mutations',w.__posts.every(p=>p.company==='Тестовое заведение'));
  frame.remove();
 }catch(error){check('runtime:'+error.stack,false);}
 document.body.dataset.done='true';
})();
</script></html>
