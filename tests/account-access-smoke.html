<!doctype html><html lang="ru"><meta charset="utf-8"><title>Account access checks</title><pre id="results">RUNNING</pre><script>
(async()=>{
 if(new URLSearchParams(location.search).has('fixture'))return;
 const checks=[],check=(name,ok)=>{checks.push(`${ok?'PASS':'FAIL'}:${name}`);document.querySelector('#results').textContent=checks.join('|');};
 const pause=()=>new Promise(resolve=>setTimeout(resolve,50));
 try{
  const [source,code]=await Promise.all([fetch('/account').then(r=>r.text()),fetch('/account.js').then(r=>r.text())]);
  const token='a'.repeat(43);
  async function fixture(suffix){
   const frame=document.createElement('iframe');frame.style.cssText='width:390px;height:900px;border:0';
   const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.src=location.pathname+'?fixture=1'+suffix;document.body.append(frame);await loaded;
   const w=frame.contentWindow,d=frame.contentDocument;
   d.open();d.write(source.replace(/<script[^>]*>[\s\S]*?<\/script>/g,'').replace('<head>','<head><base href="/">'));d.close();
   w.history.replaceState(null,'',location.pathname+'?fixture=1'+suffix);
   w.__calls=[];w.AshkanaApi={setClientMode:()=>{},forgotPassword:async email=>{w.__calls.push({email});return {message:'Письмо будет отправлено, если аккаунт существует.'};},resetPassword:async(t,password)=>{w.__calls.push({token:t,password});return {ok:true};},verifyEmail:async t=>{w.__calls.push({token:t});return {ok:true};},emailStatus:async()=>({email:'owner@example.com',verified:false,canVerify:true}),sendVerificationEmail:async()=>({message:'Письмо поставлено в очередь.'})};
   const script=d.createElement('script');script.textContent=code;d.body.append(script);await pause();return {frame,w,d,q:s=>d.querySelector(s)};
  }
  let f=await fixture('#action=reset&token='+token);
  check('token-removed-from-url',!f.w.location.hash);
  check('no-consumption-on-open',f.w.__calls.length===0&&!f.q('#resetForm').hidden);
  f.q('#resetForm').elements.password.value='abcde';f.q('#resetForm').elements.confirmation.value='Different-password-123';f.q('#resetForm').requestSubmit();await pause();
  check('password-confirmation-required',f.w.__calls.length===0&&f.q('#accountMessage').textContent.includes('не совпадают'));
  f.q('#resetForm').elements.confirmation.value='abcde';check('five-character-reset-valid',f.q('#resetForm').checkValidity());f.q('#resetForm').requestSubmit();await pause();
  check('reset-posts-token-and-clears-password',f.w.__calls.length===1&&f.w.__calls[0].token===token&&!f.q('#resetForm').elements.password.value&&f.q('#resetForm').hidden);
  check('mobile-layout-fits',f.d.documentElement.scrollWidth<=f.w.innerWidth+1);
  f.frame.remove();f=await fixture('#action=verify&token='+token);
  check('verification-requires-click',f.w.__calls.length===0&&!f.q('#verifyForm').hidden);
  f.q('#verifyForm').requestSubmit();await pause();
  check('verification-confirmed',f.w.__calls.length===1&&f.q('#accountMessage').textContent.includes('подтверждён')&&!f.q('#workspaceLink').hidden);
  f.frame.remove();f=await fixture('');f.q('#forgotForm').elements.email.value='owner@example.com';f.q('#forgotForm').requestSubmit();await pause();
  check('generic-recovery-response',f.w.__calls[0].email==='owner@example.com'&&f.q('#accountMessage').textContent.includes('если аккаунт существует'));
  f.frame.remove();f=await fixture('#action=reset&token=bad');check('bad-link-does-not-offer-reset',f.q('#resetForm').hidden&&f.q('#accountMessage').textContent.includes('неполная'));f.frame.remove();
 }catch(error){check('runtime:'+error.stack,false);}
 document.body.dataset.done='true';
})();
</script></html>
