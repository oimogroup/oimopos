<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8"><title>Admin smoke test</title></head>
  <body>
    <div id="results">WAIT</div>
    <iframe id="app" src="../admin?test=1#inventory" style="display:none"></iframe>
    <script>
      document.querySelector("#app").addEventListener("load", async () => {
        const frame = document.querySelector("#app");
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        const checks = [];
        const check = (name, condition) => checks.push(`${condition ? "PASS" : "FAIL"}:${name}`);
        const keys = ["ashkana-admin-ingredients-v1", "ashkana-admin-recipes-v1", "ashkana-admin-preparations-v1", "ashkana-admin-products-v1", "ashkana-menu-categories-v1", "ashkana-ingredient-categories-v1", "ashkana-stations-v1", "ashkana-stock-documents-v1", "ashkana-production-logistics-v3", "ashkana-stock-suppliers-v1", "ashkana-finance-v1", "ashkana-branches-v1", "ashkana-access-accounts-v1", "ashkana-pos-sales", "ashkana-notifications-read-v1-test"];
        const snapshot = Object.fromEntries(keys.map((key) => [key, win.localStorage.getItem(key)]));
        try {
          check("single-point", doc.querySelectorAll("#branchCards .branch-card").length === 1 && doc.querySelector("#branchCards").textContent.includes("Манаса"));
          check("central-role-removed", !doc.querySelector('[data-role-navigation="warehouse"]') && !doc.body.textContent.toLowerCase().includes("центральный склад"));
          const stockTabs = [...doc.querySelectorAll("[data-stock-tab]")].map((button) => button.dataset.stockTab);
          check("poster-supply-tabs", stockTabs.join(",") === "overview,supplies,point-transfers,writeoff,inventories,movement,suppliers");
          check("poster-navigation-groups", ["menu", "stock", "finance", "access"].every((section) => doc.querySelector(`[data-nav-section="${section}"]`)));
          check("setup-guide", doc.querySelectorAll("#setupGuide [data-setup-route]").length === 5);
          check("owner-no-point-switcher", !doc.querySelector("#objectSwitcher") && !doc.querySelector("#applyObjectButton"));
          check("owner-access-model", doc.querySelector('[data-owner-access-view="registers"]').textContent.includes("Кассы") && doc.querySelector('[data-owner-access-view="employees"]').textContent.includes("Сотрудники"));
          check("owner-branch-navigation", Boolean(doc.querySelector('[data-owner-access-view="branches"]')) && !doc.querySelector("#view-dashboard").textContent.includes("Заказы точек") && !doc.querySelector("#view-dashboard").textContent.includes("Итого по сети"));
          win.switchStockTab("writeoff");
          check("stock-writeoff-navigation", doc.querySelector("#stockPageTitle").textContent === "Списания" && !doc.querySelector("#documentActionButton").classList.contains("hidden"));
          win.switchStockTab("movement");
          check("stock-movement-navigation", doc.querySelector("#stockPageTitle").textContent === "Отчёт по движению" && doc.querySelector("#documentActionButton").classList.contains("hidden"));
          win.switchStockTab("overview");
          check("stock-rendered", doc.querySelectorAll("#stockTable tr").length >= 15 && doc.querySelector("#stockTable").textContent.includes("Вода 0,5 л"));
          check("network-stock-caption", doc.querySelector("#stockValueCaption").textContent.includes("всем точкам") && doc.querySelector("#stockWarehouseFilter").value === "Вся сеть" && doc.querySelector("#lowStockCaption").textContent.includes("поставщику"));

          const bell = doc.querySelector("#notificationButton");
          check("notification-bell", Boolean(bell.querySelector("svg")));
          win.eval(`logisticsState.custodyDocuments=[{id:'notify-writeoff',kind:'writeoff',status:'pending',branchId:branches[0].id,recipeId:recipes[0].id,weight:Number(recipes[0].yield)/1000*2,reason:'Истёк срок хранения',actor:{name:'Кассир тест'},createdAt:new Date().toISOString()}]`);
          win.renderNotifications();
          const writeoffNotification=doc.querySelector('[data-notification-id="custody-writeoff-notify-writeoff"]');
          check('writeoff-notification-details',Boolean(writeoffNotification)&&writeoffNotification.textContent.includes('2 порц.')&&writeoffNotification.textContent.includes('Кассир тест')&&writeoffNotification.textContent.includes('Истёк срок хранения')&&writeoffNotification.textContent.includes(win.eval('recipes[0].name')));
          const originalJournal=win.openCustodyJournal;let openedWriteoff;
          win.openCustodyJournal=id=>{openedWriteoff=id;};writeoffNotification.click();win.openCustodyJournal=originalJournal;
          check('writeoff-notification-opens-document',openedWriteoff==='notify-writeoff');
          win.eval('logisticsState.custodyDocuments[0].status="approved"');win.renderNotifications();
          check('resolved-writeoff-notification-removed',!doc.querySelector('[data-notification-id="custody-writeoff-notify-writeoff"]'));
          win.eval('logisticsState.custodyDocuments[0].kind="surplus";logisticsState.custodyDocuments[0].status="pending"');win.renderNotifications();
          const surplusAlert=doc.querySelector('[data-notification-id="custody-surplus-notify-writeoff"]');
          check('surplus-notification-details',Boolean(surplusAlert)&&surplusAlert.textContent.includes('Излишек:')&&surplusAlert.textContent.includes('2 порц.'));
          win.eval('logisticsState.custodyDocuments=[]');

          bell.click();
          check("notification-panel", !doc.querySelector("#notificationPanel").classList.contains("hidden"));
          doc.querySelector("#markNotificationsRead").click();
          check("notification-mark-read", doc.querySelector("#notificationBadge").classList.contains("hidden"));
          bell.click();

          win.switchMenuPage("products");
          check("products-navigation", doc.querySelectorAll("#productsTable tr").length >= 5);
          check("menu-no-basket", !doc.querySelector("#view-recipes").textContent.includes("Корзина"));
          win.switchMenuPage("ingredients");
          check("ingredients-navigation", doc.querySelectorAll("#ingredientsTable tr").length >= 10);
          win.switchMenuPage("preparations");
          check("preparations-navigation", doc.querySelectorAll("#preparationsTable tr").length === 3);
          const menuButton = doc.querySelector('.nav-item[data-nav-section="menu"]');
          menuButton.click();
          check("menu-subnav-close", !doc.querySelector("#menuSubnav").classList.contains("visible") && menuButton.getAttribute("aria-expanded") === "false");
          menuButton.click();
          check("menu-subnav-reopen", doc.querySelector("#menuSubnav").classList.contains("visible") && menuButton.getAttribute("aria-expanded") === "true");

          win.switchStockTab("suppliers");
          win.openSupplierForm();
          check("supplier-account-wide", doc.querySelector(".supplier-location-section").classList.contains("hidden"));
          doc.querySelector("#supplierNameInput").value = "Тестовый поставщик";
          doc.querySelector("#supplierInnInput").value = "123456789012";
          doc.querySelector("#supplierPhoneInput").value = "+996 555 000 111";
          doc.querySelector("#supplierEmailInput").value = "orders@test.kg";
          win.saveSupplier();
          let savedSuppliers = JSON.parse(win.localStorage.getItem("ashkana-stock-suppliers-v1") || "[]");
          const testSupplier = savedSuppliers.find((supplier) => supplier.name === "Тестовый поставщик");
          check("supplier-create", Boolean(testSupplier) && testSupplier.locations.join(",") === "b1");
          check("suppliers-registry", doc.querySelector("#suppliersTable").textContent.includes("Тестовый поставщик") && doc.querySelector("#suppliersTable").textContent.includes("Весь аккаунт"));
          win.openSupplierForm(testSupplier.id);
          doc.querySelector("#supplierPhoneInput").value = "+996 700 999 888";
          win.saveSupplier();
          savedSuppliers = JSON.parse(win.localStorage.getItem("ashkana-stock-suppliers-v1") || "[]");
          check("supplier-edit", savedSuppliers.find((supplier) => supplier.id === testSupplier.id).phone === "+996 700 999 888");

          win.openIngredientForm();
          doc.querySelector("#ingredientNameInput").value = "Тестовый ингредиент";
          doc.querySelector("#ingredientStockInput").value = "5";
          doc.querySelector("#ingredientCostInput").value = "80";
          win.saveIngredientForm();
          const savedIngredient = JSON.parse(win.localStorage.getItem("ashkana-admin-ingredients-v1") || "[]").find((item) => item.name === "Тестовый ингредиент");
          check("ingredient-point-opening", savedIngredient.stock === 0 && win.branchStock("b1", savedIngredient.id) === 5 && win.branchUnitCost("b1", savedIngredient.id) === 80);
          win.openIngredientForm(savedIngredient.id);
          check("ingredient-delete-action", !doc.querySelector("#deleteIngredientButton").classList.contains("hidden"));
          doc.querySelector("#deleteIngredientButton").click();
          check("ingredient-delete-stock-protection", doc.querySelector("#confirmCatalogDeleteButton").disabled && doc.querySelector("#catalogDeleteStatus").textContent.includes("обнулите остаток"));
          doc.querySelector("#catalogDeleteModal").classList.add("hidden");
          doc.querySelector("#ingredientModal").classList.add("hidden");
          win.openRecipeForm(201);
          check("ingredient-in-recipes", [...doc.querySelectorAll("#recipeComponentsEditor option")].some((option) => option.textContent === "Тестовый ингредиент"));
          const originalYield = Number(doc.querySelector("#recipeYieldInput").value);
          const firstRecipeNet = doc.querySelector("#recipeComponentsEditor .component-net");
          firstRecipeNet.value = "160";
          firstRecipeNet.dispatchEvent(new Event("input", { bubbles: true }));
          check("recipe-yield-explicit", Number(doc.querySelector("#recipeYieldInput").value) === originalYield && !doc.querySelector("#recipeYieldInput").readOnly);
          doc.querySelector("#recipeModal").classList.add("hidden");

          win.switchMenuPage("preparations");
          doc.querySelector("#menuPageActionButton").click();
          check("preparation-create-form", !doc.querySelector("#preparationModal").classList.contains("hidden") && doc.querySelectorAll("#preparationComponentsEditor .preparation-component-row").length === 1);
          doc.querySelector("#preparationNameInput").value = "Тестовая заготовка";
          doc.querySelector("#preparationYieldInput").value = "500";
          doc.querySelector("#preparationProcessInput").value = "Замесить, выдержать и охладить";
          doc.querySelector("#preparationUsedInInput").value = "Тестовое блюдо";
          const preparationRow = doc.querySelector("#preparationComponentsEditor .preparation-component-row");
          preparationRow.querySelector(".preparation-component-ingredient").value = savedIngredient.id;
          preparationRow.querySelector(".preparation-component-gross").value = "500";
          preparationRow.querySelector(".preparation-component-net").value = "500";
          win.savePreparationForm();
          let savedPreparations = JSON.parse(win.localStorage.getItem("ashkana-admin-preparations-v1") || "[]");
          const savedPreparation = savedPreparations.find((item) => item.name === "Тестовая заготовка");
          check("preparation-create", savedPreparation?.components[0].ingredientId === savedIngredient.id && savedPreparation.process === "Замесить, выдержать и охладить" && savedPreparation.cost === 40 && doc.querySelector("#preparationsTable").textContent.includes("Тестовая заготовка"));
          win.openPreparationForm(savedPreparation.id);
          doc.querySelector("#preparationNameInput").value = "Тестовая заготовка новая";
          win.savePreparationForm();
          savedPreparations = JSON.parse(win.localStorage.getItem("ashkana-admin-preparations-v1") || "[]");
          check("preparation-edit", savedPreparations.find((item) => item.id === savedPreparation.id)?.name === "Тестовая заготовка новая");
          win.openPreparationForm(savedPreparation.id);
          doc.querySelector("#deletePreparationButton").click();
          check("preparation-delete-confirmation", !doc.querySelector("#catalogDeleteModal").classList.contains("hidden") && !doc.querySelector("#confirmCatalogDeleteButton").disabled);
          doc.querySelector("#confirmCatalogDeleteButton").click();
          check("preparation-delete", !JSON.parse(win.localStorage.getItem("ashkana-admin-preparations-v1") || "[]").some((item) => item.id === savedPreparation.id));

          win.switchMenuPage("menu-categories");
          const hotCategoryRow = [...doc.querySelectorAll("#menuCategoriesTable tr")].find((row) => row.textContent.includes("Горячее"));
          hotCategoryRow.querySelector("[data-menu-category-edit]").click();
          check("menu-category-edit-form", !doc.querySelector("#categoryModal").classList.contains("hidden") && doc.querySelector("#categoryNameInput").value === "Горячее");
          doc.querySelector("#categoryNameInput").value = "Основные блюда тест";
          doc.querySelector("#categoryColorText").value = "#123456";
          win.saveCategoryForm();
          let savedRecipes = JSON.parse(win.localStorage.getItem("ashkana-admin-recipes-v1") || "[]");
          check("menu-category-edit", savedRecipes.find((recipe) => recipe.id === 201)?.category === "Основные блюда тест" && JSON.parse(win.localStorage.getItem("ashkana-menu-categories-v1") || "[]").some(category => category.name === "Основные блюда тест" && category.color === "#123456") && doc.querySelector("#menuCategoriesTable").textContent.includes("Основные блюда тест"));
          const renamedMenuIndex = [...doc.querySelectorAll("#menuCategoriesTable tr")].find((row) => row.textContent.includes("Основные блюда тест"))?.querySelector("[data-menu-category-edit]")?.dataset.menuCategoryEdit;
          win.openCategoryForm("menu", renamedMenuIndex);
          doc.querySelector("#categoryNameInput").value = "Горячее";
          doc.querySelector("#categoryColorText").value = "#E39A3D";
          win.saveCategoryForm();
          win.switchMenuPage("menu-categories");
          doc.querySelector("#menuPageActionButton").click();
          doc.querySelector("#categoryNameInput").value = "Тестовая категория меню";
          doc.querySelector("#categoryColorText").value = "#445566";
          win.saveCategoryForm();
          const savedMenuCategories = JSON.parse(win.localStorage.getItem("ashkana-menu-categories-v1") || "[]");
          check("menu-category-create", savedMenuCategories.some((category) => category.name === "Тестовая категория меню" && category.color === "#445566"));
          const testMenuCategoryRow = [...doc.querySelectorAll("#menuCategoriesTable tr")].find((row) => row.textContent.includes("Тестовая категория меню"));
          testMenuCategoryRow.querySelector("[data-menu-category-edit]").click();
          doc.querySelector("#deleteCategoryButton").click();
          doc.querySelector("#confirmCatalogDeleteButton").click();
          check("menu-category-delete", !JSON.parse(win.localStorage.getItem("ashkana-menu-categories-v1") || "[]").some((category) => category.name === "Тестовая категория меню"));

          win.switchMenuPage("ingredient-categories");
          const meatCategoryRow = [...doc.querySelectorAll("#ingredientCategoriesTable tr")].find((row) => row.textContent.includes("Мясо"));
          meatCategoryRow.querySelector("[data-ingredient-category-edit]").click();
          doc.querySelector("#categoryNameInput").value = "Мясо тест";
          win.saveCategoryForm();
          let savedIngredients = JSON.parse(win.localStorage.getItem("ashkana-admin-ingredients-v1") || "[]");
          check("ingredient-category-edit", savedIngredients.find((ingredient) => ingredient.id === "beef")?.category === "Мясо тест" && doc.querySelector("#ingredientCategoriesTable").textContent.includes("Мясо тест"));
          const renamedIngredientIndex = [...doc.querySelectorAll("#ingredientCategoriesTable tr")].find((row) => row.textContent.includes("Мясо тест"))?.querySelector("[data-ingredient-category-edit]")?.dataset.ingredientCategoryEdit;
          win.openCategoryForm("ingredient", renamedIngredientIndex);
          doc.querySelector("#categoryNameInput").value = "Мясо";
          win.saveCategoryForm();

          win.switchMenuPage("stations");
          const kitchenStationRow = [...doc.querySelectorAll("#stationsTable tr")].find((row) => row.textContent.includes("Кухня"));
          kitchenStationRow.querySelector("[data-station-edit]").click();
          check("station-edit-form", !doc.querySelector("#stationModal").classList.contains("hidden") && doc.querySelector("#stationNameInput").value === "Кухня");
          doc.querySelector("#stationNameInput").value = "Горячий цех тест";
          doc.querySelector("#stationDestinationInput").value = "Экран горячего цеха";
          win.saveStationForm();
          let savedStations = JSON.parse(win.localStorage.getItem("ashkana-stations-v1") || "[]");
          savedRecipes = JSON.parse(win.localStorage.getItem("ashkana-admin-recipes-v1") || "[]");
          savedPreparations = JSON.parse(win.localStorage.getItem("ashkana-admin-preparations-v1") || "[]");
          check("station-edit", savedStations.some((station) => station.name === "Горячий цех тест") && savedRecipes.find((recipe) => recipe.id === 201)?.station === "Горячий цех тест" && savedPreparations.find((preparation) => preparation.id === "pf-1")?.station === "Горячий цех тест");
          doc.querySelector("#menuPageActionButton").click();
          doc.querySelector("#stationNameInput").value = "Кондитерский цех тест";
          doc.querySelector("#stationDestinationMode").value = "none";
          doc.querySelector("#stationDestinationMode").dispatchEvent(new Event("change", { bubbles: true }));
          win.saveStationForm();
          savedStations = JSON.parse(win.localStorage.getItem("ashkana-stations-v1") || "[]");
          check("station-create", savedStations.some((station) => station.name === "Кондитерский цех тест" && station.destination === "Без печати") && doc.querySelector("#stationsTable").textContent.includes("Кондитерский цех тест"));
          win.openStationForm("Кондитерский цех тест");
          doc.querySelector("#deleteStationButton").click();
          doc.querySelector("#confirmCatalogDeleteButton").click();
          check("station-delete", !JSON.parse(win.localStorage.getItem("ashkana-stations-v1") || "[]").some((station) => station.name === "Кондитерский цех тест"));

          win.openProductForm();
          doc.querySelector("#productNameInput").value = "Тестовый товар";
          doc.querySelector("#productBarcodeInput").value = "1234567890123";
          doc.querySelector("#productCostInput").value = "40";
          doc.querySelector("#productPriceInput").value = "65";
          doc.querySelector("#productStockInput").value = "12";
          await win.saveProductForm();
          const savedProduct = JSON.parse(win.localStorage.getItem("ashkana-admin-products-v1") || "[]").find((item) => item.name === "Тестовый товар");
          check("product-point-opening", savedProduct.stock === 0 && win.branchStock("b1", savedProduct.id) === 12 && win.branchUnitCost("b1", savedProduct.id) === 40);
          win.openProductForm(savedProduct.id);
          doc.querySelector("#deleteProductButton").click();
          check("product-delete-stock-protection", doc.querySelector("#confirmCatalogDeleteButton").disabled && doc.querySelector("#catalogDeleteStatus").textContent.includes("обнулите остаток"));
          doc.querySelector("#catalogDeleteModal").classList.add("hidden");
          doc.querySelector("#productModal").classList.add("hidden");
          win.renderStock();
          check("product-in-point-stock", doc.querySelector("#stockTable").textContent.includes("Тестовый товар"));

          const riceMasterBefore = win.ingredientById("rice").stock;
          const riceBefore = win.branchStock("b1", "rice");
          const riceCostBefore = win.branchUnitCost("b1", "rice");
          const productBefore = win.branchStock("b1", "p-1");
          win.openSupplyForm();
          check("supply-form", !doc.querySelector("#supplyModal").classList.contains("hidden") && [...doc.querySelectorAll("#supplySupplier option")].some((option) => option.textContent === "Тестовый поставщик"));
          check("supply-products", [...doc.querySelectorAll(".supply-item-product option")].some((option) => option.textContent === "Вода 0,5 л"));
          doc.querySelector("#supplySupplier").value = testSupplier.id;
          const firstSupplyRow = doc.querySelector(".supply-item-row");
          firstSupplyRow.querySelector(".supply-item-product").value = "rice";
          firstSupplyRow.querySelector(".supply-item-quantity").value = "3";
          firstSupplyRow.querySelector(".supply-item-price").value = "80";
          doc.querySelector("#addSupplyItemButton").click();
          const supplyRows = doc.querySelectorAll(".supply-item-row");
          supplyRows[1].querySelector(".supply-item-product").value = "p-1";
          supplyRows[1].querySelector(".supply-item-quantity").value = "2";
          supplyRows[1].querySelector(".supply-item-price").value = "30";
          doc.querySelector("#supplyInvoiceNumber").value = "DIRECT-001";
          doc.querySelector("#addSupplyPaymentButton").click();
          doc.querySelector(".supply-payment-amount").value = "200";
          win.saveSupply();
          const receivedSupply = JSON.parse(win.localStorage.getItem("ashkana-production-logistics-v3")).supplies[0];
          const expectedRiceCost = (riceBefore * riceCostBefore + 3 * 80) / (riceBefore + 3);
          check("supply-create", receivedSupply.status === "received" && receivedSupply.invoiceNumber === "DIRECT-001" && receivedSupply.total === 300 && receivedSupply.paidTotal === 200 && receivedSupply.debt === 100);
          check("point-stock-increase", win.branchStock("b1", "rice") === riceBefore + 3 && win.branchStock("b1", "p-1") === productBefore + 2);
          check("point-average-cost", Math.abs(win.branchUnitCost("b1", "rice") - expectedRiceCost) < .001);
          check("master-stock-untouched", win.ingredientById("rice").stock === riceMasterBefore);
          check("supplier-last-price", JSON.parse(win.localStorage.getItem("ashkana-stock-suppliers-v1")).find((supplier) => supplier.id === testSupplier.id).prices.b1.rice === 80);
          check("supply-finance-payment", JSON.parse(win.localStorage.getItem("ashkana-finance-v1")).transactions.some((transaction) => transaction.documentId === receivedSupply.id && transaction.amount === 200));

          win.switchStockTab("supplies");
          check("receipt-registry", doc.querySelector("#documentsTableBody").textContent.includes("DIRECT-001") && doc.querySelector("#documentsTableBody").textContent.includes("Тестовый поставщик"));
          check("receipt-filters", Boolean(doc.querySelector("#documentSearch")) && Boolean(doc.querySelector("#documentDateFrom")) && Boolean(doc.querySelector("#documentPartyFilter")));
          doc.querySelector("#documentSearch").value = "DIRECT-001";
          win.renderDocuments("supplies");
          check("receipt-search", doc.querySelectorAll("#documentsTableBody tr").length === 1);
          doc.querySelector("#documentSearch").value = "";
          doc.querySelector("#documentPartyFilter").value = testSupplier.id;
          win.renderDocuments("supplies");
          check("receipt-supplier-filter", doc.querySelectorAll("#documentsTableBody tr").length === 1);
          doc.querySelector("#documentDateFrom").value = "2999-01-01";
          win.renderDocuments("supplies");
          check("receipt-date-filter", doc.querySelectorAll("#documentsTableBody tr").length === 0);
          doc.querySelector("#resetDocumentFilters").click();
          check("receipt-filter-reset", !doc.querySelector("#documentSearch").value && !doc.querySelector("#documentDateFrom").value && doc.querySelector("#documentPartyFilter").value === "all");

          check("second-point-test-setup", win.addConfiguredBranch({ id: "b2", number: 2, short: "Тестовая 2", name: "Столовая №2 — Тестовая", route: "Поставщики → Тестовая" }, { rice: 12, "p-1": 5 }, { rice: 90, "p-1": 26 }));
          const destinationRiceBeforeTransfer = win.branchStock("b1", "rice");
          const destinationRiceCostBeforeTransfer = win.branchUnitCost("b1", "rice");
          const destinationProductBeforeTransfer = win.branchStock("b1", "p-1");
          const sourceRiceBeforeTransfer = win.branchStock("b2", "rice");
          const sourceProductBeforeTransfer = win.branchStock("b2", "p-1");
          win.openPointTransferForm();
          check("point-transfer-form", !doc.querySelector("#pointTransferModal").classList.contains("hidden") && doc.querySelector("#pointTransferSource").value === "b2" && doc.querySelector("#pointTransferDestination").value === "b1");
          const firstTransferRow = doc.querySelector(".point-transfer-item-row");
          firstTransferRow.querySelector(".point-transfer-item-product").value = "rice";
          firstTransferRow.querySelector(".point-transfer-item-quantity").value = "4";
          doc.querySelector("#addPointTransferItemButton").click();
          const transferRows = doc.querySelectorAll(".point-transfer-item-row");
          transferRows[1].querySelector(".point-transfer-item-product").value = "p-1";
          transferRows[1].querySelector(".point-transfer-item-quantity").value = "2";
          win.savePointTransfer();
          const pointTransfer = JSON.parse(win.localStorage.getItem("ashkana-production-logistics-v3")).pointTransfers[0];
          check("point-transfer-request", pointTransfer.status === "submitted" && pointTransfer.sourceBranchId === "b2" && pointTransfer.destinationBranchId === "b1" && pointTransfer.items.length === 2);
          check("point-transfer-request-no-stock-change", win.branchStock("b2", "rice") === sourceRiceBeforeTransfer && win.branchStock("b1", "rice") === destinationRiceBeforeTransfer);
          check("point-transfer-owner-notification", doc.querySelector("#notificationList").textContent.includes(pointTransfer.number) && doc.querySelector("#notificationList").textContent.includes("ждёт согласования"));
          win.approvePointTransfer(pointTransfer.id);
          check("point-transfer-approval", win.pointTransferById(pointTransfer.id).status === "approved" && win.pointTransferById(pointTransfer.id).items.every((item) => item.approved === item.requested));
          win.dispatchPointTransfer(pointTransfer.id);
          check("point-transfer-dispatch", win.pointTransferById(pointTransfer.id).status === "shipped" && win.branchStock("b2", "rice") === sourceRiceBeforeTransfer - 4 && win.branchStock("b2", "p-1") === sourceProductBeforeTransfer - 2);
          check("point-transfer-source-cost", win.pointTransferById(pointTransfer.id).items.find((item) => item.itemId === "rice").unitCost === 90);
          win.openPointTransferReceiving(pointTransfer.id);
