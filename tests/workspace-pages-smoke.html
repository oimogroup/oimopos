<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8"><title>Full-page workspaces smoke test</title></head>
  <body>
    <pre id="results">RUNNING</pre>
    <iframe id="app" src="../admin?test=1#menu/ingredients" style="position:fixed;left:-10000px;width:1900px;height:950px;border:0"></iframe>
    <script>
      document.querySelector("#app").addEventListener("load", () => {
        const frame = document.querySelector("#app");
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        const preview = new URLSearchParams(location.search).get("preview");
        if (preview) {
          document.querySelector("#results").hidden = true;
          frame.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;border:0";
          if (preview === "ingredient") win.openIngredientForm();
          else if (preview === "employee") win.openEmployeeForm();
          else if (preview === "supplier") win.openSupplierForm();
          else if (preview === "recipe") win.openRecipe(201);
          return;
        }
        const checks = [];
        const check = (name, condition) => checks.push(`${condition ? "PASS" : "FAIL"}:${name}`);
        try {
          const workspaceLeft = doc.querySelector('.admin-main').getBoundingClientRect().left;
          const workspaceWidth = win.innerWidth - workspaceLeft;
          const sidebar = doc.querySelector('.sidebar');
          const sidebarBefore = sidebar.getBoundingClientRect();
          const content = doc.querySelector('.admin-content');
          const spacer = doc.createElement('div');
          spacer.style.height = `${win.innerHeight * 2}px`;
          content.append(spacer);
          content.scrollTop = win.innerHeight;
          const sidebarAfter = sidebar.getBoundingClientRect();
          check('sidebar-static-during-content-scroll', content.scrollTop > 0 && sidebarBefore.top === sidebarAfter.top && sidebarBefore.bottom === sidebarAfter.bottom);
          check('content-does-not-overlap-sidebar', workspaceLeft >= sidebarAfter.right);
          content.scrollTop = 0;
          spacer.remove();
          const workspaces = [...doc.querySelectorAll(".modal-backdrop:not(.supply-page-backdrop):not(.catalog-delete-backdrop), .side-drawer-backdrop")];
          check("all-workspaces-covered", workspaces.length >= 28);
          check("all-workspaces-have-back", workspaces.every((workspace) => workspace.querySelector(".workspace-back")));

          win.openIngredientForm();
          const ingredientBackdrop = doc.querySelector("#ingredientModal");
          const ingredientPage = ingredientBackdrop.querySelector(".admin-modal");
          const backdropStyle = win.getComputedStyle(ingredientBackdrop);
          const pageStyle = win.getComputedStyle(ingredientPage);
          check("ingredient-opens-as-page", !ingredientBackdrop.classList.contains("hidden") && parseFloat(backdropStyle.left) === workspaceLeft && pageStyle.backgroundColor === "rgb(255, 255, 255)");
          check("ingredient-no-popup-card", parseFloat(pageStyle.width) === workspaceWidth && parseFloat(pageStyle.height) === win.innerHeight && pageStyle.borderRadius === "0px" && pageStyle.boxShadow === "none");
          ingredientBackdrop.classList.add("hidden");

          win.openSupplierForm();
          const supplierBackdrop = doc.querySelector("#supplierModal");
          check("supplier-opens-as-page", !supplierBackdrop.classList.contains("hidden") && parseFloat(win.getComputedStyle(supplierBackdrop).left) === workspaceLeft);
          supplierBackdrop.classList.add("hidden");

          win.openEmployeeForm();
          const employeeBackdrop = doc.querySelector("#employeeModal");
          check("employee-opens-as-page", !employeeBackdrop.classList.contains("hidden") && win.getComputedStyle(employeeBackdrop).backgroundColor === "rgb(255, 255, 255)");
          employeeBackdrop.classList.add("hidden");

          win.openRecipe(201);
          const drawer = doc.querySelector("#recipeDrawer .detail-drawer");
          check("details-open-as-page", !doc.querySelector("#recipeDrawer").classList.contains("hidden") && parseFloat(win.getComputedStyle(drawer).width) === workspaceWidth && win.getComputedStyle(drawer).boxShadow === "none");
          doc.querySelector("#recipeDrawer").classList.add("hidden");

          doc.querySelector("#catalogDeleteModal").classList.remove("hidden");
          const deleteStyle = win.getComputedStyle(doc.querySelector("#catalogDeleteModal .admin-modal"));
          check("delete-keeps-safe-confirmation", parseFloat(deleteStyle.width) < workspaceWidth && deleteStyle.borderRadius !== "0px");
        } catch (error) {
          checks.push(`FAIL:runtime:${error.message}`);
        }
        document.querySelector("#results").textContent = checks.join("|");
      }, { once: true });
    </script>
  </body>
</html>
