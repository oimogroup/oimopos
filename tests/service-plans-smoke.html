<!doctype html><meta charset="utf-8"><title>Service plans</title><div id="results">RUNNING</div>
<script>
(async () => {
 if(new URLSearchParams(location.search).has('fixture'))return;
 const checks=[]; const check=(name,ok)=>checks.push(`${ok?'PASS':'FAIL'}:${name}`);
 try {
  const html=await fetch('../platform.html').then(r=>r.text());
  const frame=document.createElement('iframe');frame.style.cssText=location.search.includes('preview')?'width:100%;height:1200px;border:0':'display:none';
  const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  // A real same-origin fixture URL preserves platform.js location.origin.
  frame.src=location.pathname+'?fixture=1';document.body.append(frame);await loaded;
  const win=frame.contentWindow, doc=frame.contentDocument;
  doc.open();doc.write(html.replace(/<script[^>]*>[\s\S]*?<\/script>/g,'').replace('<head>','<head><base href="/">'));doc.close();
  check('fixture-origin',win.location.origin===location.origin);
  const data=[{code:'canteen',name:'Столовая',monthly_price:3500,annual_price:42000},{code:'restaurant',name:'Ресторан',monthly_price:4000,annual_price:48000}];
  let updates=0;
  win.AshkanaApi={me:async()=>({session:{role:'platform_owner',name:'Владелец',initials:'ВП'}}),plans:async()=>data,tenants:async()=>[{id:'t1',name:'Старая столовая',slug:'old',plan_code:'starter',max_branches:3,status:'active',subscription_status:'active',branch_count:1}],updatePlan:async(code,payload)=>{updates++;const plan=data.find(p=>p.code===code);Object.assign(plan,payload);return plan;}};
  const script=doc.createElement('script');script.textContent=await fetch('../platform.js').then(r=>r.text());doc.body.append(script);
  await new Promise(resolve=>setTimeout(resolve,200));
  check('two-editable-plans',doc.querySelectorAll('[data-plan]').length===2);
  const form=doc.querySelector('[data-plan="restaurant"]');form.elements.price.value='4200.50';form.elements.annualPrice.value='45000';form.requestSubmit();
  await new Promise(resolve=>setTimeout(resolve,100));
  check('price-saved-and-reloaded',updates===1&&doc.querySelector('[data-plan="restaurant"] input').value==='4200.5');
  check('annual-price-saved-independently',doc.querySelector('[data-plan="restaurant"] input[name=annualPrice]').value==='45000');
  check('price-in-tenant-selector',doc.querySelector('#tenantPlan').textContent.includes('4 200,5'));
  win.openTenantSettings('t1');
  check('legacy-plan-preserved',doc.querySelector('#settingsTenantPlan').value==='starter');
  doc.querySelector('[data-close-settings]').click();
  win.openTenantModal();
  check('new-clients-default-canteen',doc.querySelector('#tenantPlan').value==='canteen');
  doc.querySelector('[data-close-modal]').click();
  win.AshkanaApi.updatePlan=async()=>{throw new Error('Нет доступа');};
  doc.querySelector('[data-plan="canteen"]').requestSubmit();await new Promise(resolve=>setTimeout(resolve,100));
  check('save-error-visible',doc.querySelector('[data-plan="canteen"] .plan-save-status').textContent==='Нет доступа');
  if(!location.search.includes('preview'))frame.remove();
 }catch(error){checks.push('FAIL:'+error.message);}
 document.querySelector('#results').textContent=checks.join('|');
})();
</script>
